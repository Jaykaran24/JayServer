version: '3.8'

services:
  # MongoDB Database
  mongo:
    image: mongo:latest
    container_name: jay-dashboard-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: jay-dashboard
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    networks:
      - jay-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jay-dashboard-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/jay-dashboard
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      NODE_ENV: production
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/.env:/app/.env
    networks:
      - jay-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend UI
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jay-dashboard-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - jay-network
    restart: unless-stopped
    environment:
      VITE_API_URL: http://backend:5000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mongo_data:
  mongo_config:

networks:
  jay-network:
    driver: bridge
